name: Scrape XCTherm Forecasts

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

# IMPORTANT: This workflow uses XCTHERM_EMAIL and XCTHERM_PASSWORD secrets.
# Both must be added to the repository secrets before this workflow can run.
# See: Settings → Secrets and variables → Actions → New repository secret

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install scraper dependencies
        run: cd server/xctherm && npm install

      - name: Run xctherm forecast scraper
        env:
          # Refresh token comes from GitHub repository secrets — never hardcoded
          # Get it from xctherm.com: DevTools → Application → Cookies → refreshToken
          XCTHERM_REFRESH_TOKEN: ${{ secrets.XCTHERM_REFRESH_TOKEN }}
          FORECAST_DATA_PATH: 'server/xctherm/forecasts'
        run: cd server/xctherm && node run.js

      - name: List generated forecasts
        run: ls -la server/xctherm/forecasts/ || echo "No forecasts directory found"

      - name: Push forecast data to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan xctherm-data-temp
          git reset
          git add server/xctherm/forecasts/ -f
          git commit -m "XCTherm forecast data $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git push origin xctherm-data-temp:xctherm-data --force
