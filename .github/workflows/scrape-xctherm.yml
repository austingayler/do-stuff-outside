name: Scrape XCTherm Forecasts

on:
  # schedule:
  #   # Run every 6 hours
  #   - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

# IMPORTANT: This workflow uses XCTHERM_EMAIL and XCTHERM_PASSWORD secrets.
# Both must be added to the repository secrets before this workflow can run.
# See: Settings → Secrets and variables → Actions → New repository secret

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Chromium and system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            chromium-browser \
            fonts-liberation \
            libasound2t64 \
            libatk-bridge2.0-0t64 \
            libatk1.0-0t64 \
            libcups2t64 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0t64 \
            libnspr4 \
            libnss3 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            xdg-utils \
            --no-install-recommends
          echo "Chromium: $(chromium-browser --version 2>/dev/null || chromium --version)"

      - name: Install scraper dependencies
        run: cd server/xctherm && npm install

      - name: Run xctherm forecast scraper
        env:
          XCTHERM_EMAIL: ${{ secrets.XCTHERM_EMAIL }}
          XCTHERM_PASSWORD: ${{ secrets.XCTHERM_PASSWORD }}
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: '/usr/bin/chromium-browser'
          FORECAST_DATA_PATH: '${{ github.workspace }}/server/xctherm/forecasts'
        run: cd server/xctherm && node run.js

      - name: List generated forecasts
        run: ls -la server/xctherm/forecasts/ || echo "No forecasts directory found"

      - name: Push forecast data to data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan xctherm-data-temp
          git reset
          git add server/xctherm/forecasts/ -f
          git commit -m "XCTherm forecast data $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes to commit"
          git push origin xctherm-data-temp:xctherm-data --force
